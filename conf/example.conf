# Run from the checkout with: ./build/nginx -p "$PWD/" -c conf/example.conf
load_module build/ngx_http_anthropic_openai_module.so;

worker_processes 1;
pid logs/bridge.pid;
error_log logs/error.log;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path logs/client_temp;
    proxy_temp_path logs/proxy_temp;

    upstream model_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 127.0.0.1:8080;
        client_max_body_size 16m;
        client_body_buffer_size 16m;

        location /v1/messages {
            anthropic_openai on;
            anthropic_openai_model backend-model;
            anthropic_openai_stream_usage on;
            anthropic_openai_count_tokens heuristic;
            # Optional: include a restricted file with anthropic_openai_api_key.

            proxy_pass http://model_backend/v1/chat/completions;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header Accept-Encoding "";
            proxy_set_header x-api-key "";
            proxy_set_header anthropic-version "";
            proxy_set_header anthropic-beta "";
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_ignore_headers X-Accel-Buffering;
            proxy_read_timeout 3600s;
        }
    }
}
